[project]
name = "browser-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "livekit-agents==1.5.1",
    "livekit-plugins-deepgram==1.5.1",
    "livekit-plugins-silero==1.5.1",
    "livekit-plugins-sarvam==1.5.1",
    "livekit-plugins-openai==1.5.1",
    "piper-tts==1.5.0",
    "python-dotenv==1.2.2",
    # chatterbox-tts requires numpy<2.0 — keep this below 2.x or its install becomes unresolvable.
    "numpy==1.26.4",
    "aiohttp==3.14.3",
    "selenium==4.27.1",
    "beautifulsoup4==4.13.4",
    "webdriver-manager==4.0.2",
    "cmake==3.31.6",
    "vosk==0.3.45",
    "moonshine-voice==0.1.0",
    "faster-whisper==1.2.1",
    "chatterbox-tts==0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
